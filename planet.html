<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOLARIS — Planetary Dossier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-space: #03040a;
      --card-bg: rgba(14, 17, 30, 0.7);
      --border-color: rgba(255, 255, 255, 0.09);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-space);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2, h3, .logo, .stat-num { font-family: 'Space Grotesk', sans-serif; }

    .stars-container {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: radial-gradient(ellipse at top, #0f172a 0%, #03040a 75%);
    }

    .star {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      animation: twinkle var(--duration) ease-in-out infinite;
      opacity: var(--opacity);
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(1); opacity: var(--opacity); }
      50% { transform: scale(1.4); opacity: 1; }
    }

    .ambient-aura {
      position: fixed;
      top: 5%;
      right: 10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 68%);
      filter: blur(90px);
      z-index: -1;
      pointer-events: none;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1150px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.15rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateX(-3px);
    }

    .logo {
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 0.08em;
      color: #fff;
      text-decoration: none;
    }

    .planet-hero {
      max-width: 1150px;
      margin: 2rem auto 4rem;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 3rem;
      align-items: center;
      animation: fadeUp 0.7s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .planet-meta-badge {
      display: inline-block;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2.8rem, 6vw, 4.75rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1.2rem;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    .overview-text {
      color: var(--text-secondary);
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .visual-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      position: relative;
    }

    .orbit-ring-deco {
      position: absolute;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.14);
      animation: slowRotate 40s linear infinite;
    }

    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .hero-sphere {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      position: relative;
      animation: floatBig 6s ease-in-out infinite;
    }

    @keyframes floatBig {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .hero-sphere.mercury {
      background: radial-gradient(circle at 30% 30%, #f5f5f4, #78716c 58%, #1c1917 95%);
      box-shadow: inset -24px -24px 45px rgba(0,0,0,0.85), 0 0 60px rgba(168, 162, 158, 0.3);
    }
    .hero-sphere.venus {
      background: radial-gradient(circle at 30% 30%, #fef9c3, #eab308 55%, #713f12 95%);
      box-shadow: inset -24px -24px 45px rgba(0,0,0,0.8), 0 0 65px rgba(234, 179, 8, 0.35);
    }
    .hero-sphere.earth {
      background: radial-gradient(circle at 30% 30%, #7dd3fc, #0284c7 50%, #1e3a8a 85%, #090d16 100%);
      box-shadow: inset -24px -24px 45px rgba(0,0,0,0.85), 0 0 70px rgba(56, 189, 248, 0.4);
    }
    .hero-sphere.earth::after {
      content: '';
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 62% 35%, rgba(74, 222, 128, 0.6) 0%, transparent 45%),
                  radial-gradient(circle at 28% 68%, rgba(74, 222, 128, 0.5) 0%, transparent 42%);
    }
    .hero-sphere.mars {
      background: radial-gradient(circle at 30% 30%, #fca5a5, #dc2626 55%, #450a0a 95%);
      box-shadow: inset -24px -24px 45px rgba(0,0,0,0.85), 0 0 65px rgba(239, 68, 68, 0.35);
    }
    .hero-sphere.jupiter {
      background: linear-gradient(180deg, #fed7aa 0%, #c2410c 22%, #ffedd5 40%, #9a3412 62%, #fed7aa 80%, #7c2d12 100%);
      box-shadow: inset -28px -26px 50px rgba(0,0,0,0.88), 0 0 70px rgba(249, 115, 22, 0.35);
    }
    .hero-sphere.saturn {
      width: 185px; height: 185px;
      background: radial-gradient(circle at 30% 30%, #fef3c7, #d97706 65%, #451a03 95%);
      box-shadow: inset -22px -22px 42px rgba(0,0,0,0.85), 0 0 65px rgba(245, 158, 11, 0.35);
    }
    .hero-sphere.saturn::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 330px; height: 86px;
      transform: translate(-50%, -50%) rotate(-22deg);
      border-radius: 50%;
      border: 14px solid rgba(253, 230, 138, 0.6);
      box-shadow: 0 0 0 7px rgba(217, 119, 6, 0.35);
    }
    .hero-sphere.uranus {
      background: radial-gradient(circle at 30% 30%, #cffafe, #06b6d4 60%, #164e63 95%);
      box-shadow: inset -24px -24px 45px rgba(0,0,0,0.8), 0 0 65px rgba(34, 211, 238, 0.4);
    }
    .hero-sphere.neptune {
      background: radial-gradient(circle at 30% 30%, #93c5fd, #2563eb 55%, #172554 95%);
      box-shadow: inset -24px -24px 45px rgba(0,0,0,0.85), 0 0 70px rgba(59, 130, 246, 0.45);
    }

    .container {
      max-width: 1150px;
      margin: 0 auto 4rem;
      padding: 0 2rem;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-bottom: 4rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.5rem;
      backdrop-filter: blur(14px);
    }

    .stat-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
    }

    .stat-num {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }

    .section-title {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    .facts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
      margin-bottom: 4rem;
    }

    .fact-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.75rem;
      backdrop-filter: blur(14px);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .fact-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .fact-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.6rem;
      display: block;
    }

    .fact-card h3 {
      font-size: 1.15rem;
      margin-bottom: 0.5rem;
    }

    .fact-card p {
      color: var(--text-secondary);
      font-size: 0.92rem;
    }

    .planet-switcher {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 2rem;
      border-top: 1px solid var(--border-color);
      gap: 1rem;
      flex-wrap: wrap;
    }

    .switch-link {
      padding: 0.8rem 1.4rem;
      border-radius: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.92rem;
      transition: all 0.2s ease;
    }

    .switch-link:hover {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 820px) {
      .planet-hero { grid-template-columns: 1fr; text-align: center; }
      .visual-stage { order: -1; min-height: 260px; }
    }
  </style>
</head>
<body>

  <div class="stars-container" id="starfield"></div>
  <div class="ambient-aura"></div>

  <nav>
    <a href="index.html" class="back-btn">← Back to Solar System</a>
    <a href="index.html" class="logo">SOLARIS</a>
  </nav>

  <main>
    <section class="planet-hero">
      <div>
        <span class="planet-meta-badge" id="p-badge">Planet 03 • Terrestrial</span>
        <h1 id="p-name">Earth</h1>
        <div class="subtitle" id="p-tagline">The Blue Oasis</div>
        <p class="overview-text" id="p-desc"></p>
      </div>

      <div class="visual-stage">
        <div class="orbit-ring-deco"></div>
        <div class="hero-sphere earth" id="p-sphere"></div>
      </div>
    </section>

    <section class="container">
      <div class="telemetry-grid" id="p-stats"></div>

      <h2 class="section-title">Fascinating Cosmic Facts</h2>
      <div class="facts-grid" id="p-facts"></div>

      <div class="planet-switcher">
        <a href="#" class="switch-link" id="prev-planet">← Previous Planet</a>
        <a href="index.html" class="switch-link">🌌 Return to Live Orbit</a>
        <a href="#" class="switch-link" id="next-planet">Next Planet →</a>
      </div>
    </section>
  </main>

  <script>
    const planetsData = {
      mercury: {
        order: "01 • Terrestrial Planet",
        name: "Mercury",
        tagline: "The Swift Messenger",
        accent: "#d6d3d1",
        glow: "rgba(168, 162, 158, 0.25)",
        desc: "Mercury is the closest planet to the Sun and the smallest world in our Solar System—only slightly larger than Earth's Moon. Despite its proximity to the Sun, it isn't the hottest planet because it lacks a thick atmosphere to trap thermal energy.",
        stats: [
          { label: "Distance from Sun", value: "57.9 Million km" },
          { label: "Orbital Year", value: "88 Earth Days" },
          { label: "Surface Gravity", value: "3.7 m/s²" },
          { label: "Atmosphere", value: "Trace Exosphere" }
        ],
        facts: [
          { title: "A Day Longer Than a Year", text: "One full solar day on Mercury takes 176 Earth days—twice as long as its 88-day orbit around the Sun." },
          { title: "Ice in Scorching Shadows", text: "Deep craters near Mercury's poles never receive direct sunlight, trapping billions of tons of water ice despite daytime highs of 430°C." },
          { title: "Shrinking Planet", text: "Mercury's massive iron core occupies roughly 85% of its radius. As the core slowly cools and contracts, the planet's crust wrinkles like a raisin." },
          { title: "Fastest Orbit", text: "Mercury hurtles through space at nearly 47 kilometers per second—faster than any other planet in the Solar System." }
        ]
      },
      venus: {
        order: "02 • Terrestrial Planet",
        name: "Venus",
        tagline: "The Veiled Inferno",
        accent: "#fde047",
        glow: "rgba(234, 179, 8, 0.28)",
        desc: "Often called Earth's twin due to their similar size and mass, Venus is a cautionary tale of runaway greenhouse warming. Dense clouds of carbon dioxide and sulfuric acid crush the surface under 92 times Earth's atmospheric pressure.",
        stats: [
          { label: "Distance from Sun", value: "108.2 Million km" },
          { label: "Surface Temp", value: "464°C (Hottest)" },
          { label: "Surface Pressure", value: "92 Bars" },
          { label: "Known Moons", value: "0" }
        ],
        facts: [
          { title: "Backwards Sunrise", text: "Venus rotates clockwise (retrograde), meaning the Sun rises in the west and sets in the east." },
          { title: "Hottest World", text: "Even though it is twice as far from the Sun as Mercury, Venus is hot enough to melt lead across its entire surface day and night." },
          { title: "Super-Rotating Winds", text: "While the planet spins sluggishly on its axis, upper-level hurricane winds circle the entire globe in just 4 Earth days." },
          { title: "Brightest Night Star", text: "Shining brightly through reflective cloud tops, Venus is the third brightest object in Earth's sky after the Sun and Moon." }
        ]
      },
      earth: {
        order: "03 • Terrestrial Planet",
        name: "Earth",
        tagline: "The Blue Oasis",
        accent: "#38bdf8",
        glow: "rgba(56, 189, 248, 0.28)",
        desc: "Earth is the third planet from the Sun and the only astronomical object known to harbor life. Positioned inside the Sun's habitable Goldilocks zone, its liquid oceans, plate tectonics, and magnetic shield sustain millions of species.",
        stats: [
          { label: "Distance from Sun", value: "149.6 Million km" },
          { label: "Ocean Coverage", value: "71% of Surface" },
          { label: "Atmosphere", value: "78% N₂, 21% O₂" },
          { label: "Known Moons", value: "1 (Luna)" }
        ],
        facts: [
          { title: "Not a Perfect Sphere", text: "Earth's rotation causes it to bulge slightly at the equator, making its equatorial diameter 43 km wider than its pole-to-pole diameter." },
          { title: "Invisible Magnetic Shield", text: "Earth's molten outer core generates a powerful magnetosphere that deflects lethal solar wind radiation away from our atmosphere." },
          { title: "Active Plate Tectonics", text: "Earth is the only known planet with shifting continental plates, constantly recycling carbon and reshaping mountains and ocean basins." },
          { title: "Stabilizing Moon", text: "Our unusually large Moon stabilizes Earth's axial tilt at 23.5°, preventing chaotic climate swings and giving us reliable seasons." }
        ]
      },
      mars: {
        order: "04 • Terrestrial Planet",
        name: "Mars",
        tagline: "The Red Frontier",
        accent: "#f87171",
        glow: "rgba(239, 68, 68, 0.28)",
        desc: "Mars is a cold, dusty desert world with a thin carbon dioxide atmosphere. Billions of years ago, it was much wetter and warmer, with rivers, lakes, and possibly a vast northern ocean.",
        stats: [
          { label: "Distance from Sun", value: "227.9 Million km" },
          { label: "Day Length", value: "24h 37m" },
          { label: "Surface Gravity", value: "38% of Earth" },
          { label: "Known Moons", value: "2 (Phobos & Deimos)" }
        ],
        facts: [
          { title: "Olympus Mons", text: "Mars is home to the largest volcano in the Solar System—standing nearly 22 km high, roughly 2.5 times taller than Mount Everest." },
          { title: "Valles Marineris", text: "A colossal canyon system stretches over 4,000 km along the Martian equator—nearly ten times longer than Earth's Grand Canyon." },
          { title: "Blue Sunsets", text: "Fine dust suspended in the Martian air scatters red light during the day, creating eerie, cool blue glows around the setting Sun." },
          { title: "Doomed Moon", text: "Mars's inner moon Phobos orbits so close that tidal forces are slowly pulling it inward; in ~50 million years it will either crash or form a ring." }
        ]
      },
      jupiter: {
        order: "05 • Gas Giant",
        name: "Jupiter",
        tagline: "King of Planets",
        accent: "#fb923c",
        glow: "rgba(249, 115, 22, 0.28)",
        desc: "Jupiter is a colossal gas giant composed mostly of hydrogen and helium. More than twice as massive as every other planet combined, its immense gravity shapes the orbits of asteroids and shields the inner Solar System.",
        stats: [
          { label: "Distance from Sun", value: "778.5 Million km" },
          { label: "Rotation Speed", value: "9h 55m (Fastest)" },
          { label: "Volume", value: "1,321 Earths" },
          { label: "Known Moons", value: "95" }
        ],
        facts: [
          { title: "The Great Red Spot", text: "A raging high-pressure storm wider than Earth has swirled across Jupiter's southern hemisphere for at least 350 years." },
          { title: "Ocean of Liquid Metal", text: "Deep beneath Jupiter's clouds, crushing pressure squeezes hydrogen gas into an electrically conducting ocean of liquid metallic hydrogen." },
          { title: "A Mini Solar System", text: "Jupiter's 95 moons include Ganymede (larger than Mercury) and Europa, which hides a salty subsurface ocean beneath an icy crust." },
          { title: "Fastest Spinner", text: "Despite its enormous size, Jupiter completes a full rotation in under 10 hours, creating fierce 600 km/h jet streams." }
        ]
      },
      saturn: {
        order: "06 • Gas Giant",
        name: "Saturn",
        tagline: "Jewel of the Ecliptic",
        accent: "#fcd34d",
        glow: "rgba(245, 158, 11, 0.28)",
        desc: "Adorned with the most spectacular ring system in the Solar System, Saturn is a golden gas giant famous for its low density, hundreds of icy moons, and enigmatic atmospheric storms.",
        stats: [
          { label: "Distance from Sun", value: "1.43 Billion km" },
          { label: "Orbital Year", value: "29.5 Earth Years" },
          { label: "Ring Span", value: "282,000 km" },
          { label: "Known Moons", value: "146 (Most)" }
        ],
        facts: [
          { title: "Lighter Than Water", text: "Saturn's average density is just 0.687 g/cm³—less than liquid water—meaning it would theoretically float in a giant bathtub." },
          { title: "Razor-Thin Rings", text: "Though Saturn's rings span 282,000 km across, they are remarkably thin—averaging only about 10 meters in vertical thickness." },
          { title: "North Pole Hexagon", text: "A mysterious, persistent six-sided jet stream storm rotates steadily around Saturn's north pole, wide enough to fit two Earths inside." },
          { title: "Titan & Enceladus", text: "Saturn's moon Titan has thick nitrogen air and liquid methane lakes, while Enceladus shoots geysers of water ice into space." }
        ]
      },
      uranus: {
        order: "07 • Ice Giant",
        name: "Uranus",
        tagline: "The Tilted World",
        accent: "#22d3ee",
        glow: "rgba(34, 211, 238, 0.28)",
        desc: "Uranus is an ice giant composed of water, ammonia, and methane ices above a rocky core. Methane gas in its upper atmosphere absorbs red light, giving the planet its serene pale-cyan hue.",
        stats: [
          { label: "Distance from Sun", value: "2.87 Billion km" },
          { label: "Axial Tilt", value: "97.77° (Sideways)" },
          { label: "Min Temp", value: "-224°C (Coldest)" },
          { label: "Known Moons", value: "28" }
        ],
        facts: [
          { title: "Rolling on Its Side", text: "Likely knocked over by an Earth-sized protoplanet collision long ago, Uranus orbits the Sun rolling on its side like a barrel." },
          { title: "21-Year Seasons", text: "Because of its extreme tilt, each pole experiences 42 continuous years of sunlight followed by 42 years of total darkness." },
          { title: "Coldest Planetary Air", text: "Even though Neptune is farther from the Sun, Uranus holds the record for the coldest measured planetary temperature at -224°C." },
          { title: "Literary Moons", text: "Unlike other planets named after mythology, Uranus's moons are named after characters from William Shakespeare and Alexander Pope." }
        ]
      },
      neptune: {
        order: "08 • Ice Giant",
        name: "Neptune",
        tagline: "The Supersonic Blue",
        accent: "#60a5fa",
        glow: "rgba(59, 130, 246, 0.3)",
        desc: "Dark, cold, and whipped by supersonic winds, Neptune is the eighth and most distant major planet orbiting our Sun—more than 30 times farther from the Sun than Earth.",
        stats: [
          { label: "Distance from Sun", value: "4.50 Billion km" },
          { label: "Orbital Year", value: "165 Earth Years" },
          { label: "Max Wind Speed", value: "2,100 km/h" },
          { label: "Known Moons", value: "16" }
        ],
        facts: [
          { title: "Discovered by Math", text: "Neptune was the first planet located using mathematical predictions rather than sky observation, after astronomers noticed unexpected tugs on Uranus." },
          { title: "Supersonic Storms", text: "Neptune generates the fastest winds in the Solar System, tearing through its frozen methane clouds at over 2,100 km/h." },
          { title: "Diamond Rain", text: "Extreme pressure and heat deep inside ice giants can split methane molecules, compressing carbon into sparkling diamond rain." },
          { title: "Only One Full Orbit", text: "Since its discovery in 1846, Neptune completed its very first full 165-year orbit around the Sun in July 2011." }
        ]
      }
    };

    const planetOrder = ["mercury", "venus", "earth", "mars", "jupiter", "saturn", "uranus", "neptune"];
    const params = new URLSearchParams(window.location.search);
    const key = (params.get("planet") || "earth").toLowerCase();
    const currentKey = planetsData[key] ? key : "earth";
    const data = planetsData[currentKey];

    document.documentElement.style.setProperty("--accent", data.accent);
    document.documentElement.style.setProperty("--accent-glow", data.glow);
    document.title = `SOLARIS — ${data.name}`;

    document.getElementById("p-badge").textContent = data.order;
    document.getElementById("p-name").textContent = data.name;
    document.getElementById("p-tagline").textContent = data.tagline;
    document.getElementById("p-desc").textContent = data.desc;
    document.getElementById("p-sphere").className = `hero-sphere ${currentKey}`;

    const statsContainer = document.getElementById("p-stats");
    statsContainer.innerHTML = data.stats.map(s => `
      <div class="stat-card">
        <div class="stat-title">${s.label}</div>
        <div class="stat-num">${s.value}</div>
      </div>
    `).join("");

    const factsContainer = document.getElementById("p-facts");
    factsContainer.innerHTML = data.facts.map((f, i) => `
      <article class="fact-card">
        <span class="fact-num">FACT 0${i + 1}</span>
        <h3>${f.title}</h3>
        <p>${f.text}</p>
      </article>
    `).join("");

    const idx = planetOrder.indexOf(currentKey);
    const prevKey = planetOrder[(idx - 1 + planetOrder.length) % planetOrder.length];
    const nextKey = planetOrder[(idx + 1) % planetOrder.length];

    const prevBtn = document.getElementById("prev-planet");
    const nextBtn = document.getElementById("next-planet");
    prevBtn.href = `planet.html?planet=${prevKey}`;
    prevBtn.textContent = `← ${planetsData[prevKey].name}`;
    nextBtn.href = `planet.html?planet=${nextKey}`;
    nextBtn.textContent = `${planetsData[nextKey].name} →`;

    const starfield = document.getElementById("starfield");
    for (let i = 0; i < 130; i++) {
      const star = document.createElement("div");
      star.classList.add("star");
      const size = Math.random() * 2.2 + 0.8;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.setProperty("--duration", `${Math.random() * 3 + 2}s`);
      star.style.setProperty("--opacity", `${Math.random() * 0.7 + 0.2}`);
      starfield.appendChild(star);
    }
  </script>
</body>
</html>
